{% extends "base.html" %}
{% block title %}Log in - FindIt{% endblock %}
{% block content %}
<div class="auth-card panel">
  <h1 class="h3 mb-3">Log in</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
    <div class="mb-3"><label class="form-label fw-semibold" for="id_username">Username</label>
      <input class="form-control" name="username" id="id_username" autofocus required></div>
    <div class="mb-3"><label class="form-label fw-semibold" for="id_password">Password</label>
      <input class="form-control" type="password" name="password" id="id_password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100" type="submit">Log in</button>
  </form>
  <p class="mt-3 mb-0 text-muted">New here? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
