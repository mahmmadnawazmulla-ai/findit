{% extends "base.html" %}
{% block title %}Create account - FindIt{% endblock %}
{% block content %}
<div class="auth-card panel">
  <h1 class="h3 mb-3">Create your account</h1>
  <form method="post" novalidate>
    {% include "portal/_form.html" %}
    <button class="btn btn-primary w-100" type="submit">Create account</button>
  </form>
  <p class="mt-3 mb-0 text-muted">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
